  <style>/* css/style.css */
/* 회의록 요약 도우미 — 화면 스타일 (data09-27 의 뼈대: 짙은 남색 사이드바 + 밝은 본문)
   390px 까지 반응형, 1023px 아래에서는 사이드바가 위쪽 메뉴로 바뀝니다. 한국어는 어절 단위 줄바꿈(keep-all). */
:root {
  --container-pad: 16px;
  --bg: #f3f6fa;
  --surface: #ffffff;
  --text: #16202c;
  --muted: #56616f;
  --line: #d6dde6;
  --primary: #2f73d9;
  --primary-dark: #215cb4;
  --primary-soft: #e8f0fc;
  --on-primary: #ffffff;
  --side: #0f2544;
  --side-2: #183a66;
  --on-side: #e7eef8;
  --on-side-muted: #9fb2cc;
  --danger: #b3261e;
  --danger-soft: #fdecea;
  --warn-bg: #fff4d6;
  --warn-line: #e8cf85;
  --warn-text: #5a4400;
  --ok: #1b6e3a;
  --ok-soft: #e3f3e8;
  --radius: 10px;
}
@media (min-width: 640px) { :root { --container-pad: 24px; } }
@media (min-width: 1024px) { :root { --container-pad: 32px; } }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  font-size: 16px; line-height: 1.6;
  word-break: keep-all; overflow-wrap: break-word;
}
button, input, select, textarea { font: inherit; color: inherit; }
input[type="file"] { max-width: 100%; }
h1, h2, h3 { line-height: 1.3; margin: 0 0 .5em; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.1rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 .75em; }
a { color: var(--primary); }
code, .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; }
.skip { position: absolute; left: -999px; }
.skip:focus { left: 8px; top: 8px; background: #fff; padding: 8px; z-index: 50; }
[hidden] { display: none !important; }

/* ── 뼈대 ─────────────────────────── */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); color: var(--on-side); padding: 20px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--on-side); padding: 0 8px 18px; }
.brand-mark { font-weight: 800; font-size: 1.25rem; letter-spacing: .02em; background: var(--side-2); border-radius: 8px; padding: 2px 8px; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-name { font-weight: 800; font-size: 1.02rem; }
.brand-sub { font-size: .78rem; color: var(--on-side-muted); }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a {
  display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 2px 8px; align-items: baseline;
  padding: 10px 12px; border-radius: var(--radius); color: var(--on-side); text-decoration: none;
}
.nav a .no { font-size: .78rem; color: var(--on-side-muted); }
.nav a .t { font-weight: 700; font-size: .95rem; }
.nav a .s { grid-column: 2; font-size: .78rem; color: var(--on-side-muted); }
.nav a:hover { background: rgba(255, 255, 255, .06); }
.nav a[aria-current="page"] { background: var(--side-2); }
.nav a[aria-current="page"] .no { color: #7fb0ff; }
.nav a .badge { margin-left: 6px; }

.body { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding: 10px var(--container-pad); background: var(--surface); border-bottom: 1px solid var(--line);
}
.topbar-chip { display: inline-flex; align-items: center; min-height: 32px; padding: 4px 12px; border-radius: 16px; background: var(--primary-soft); border: 1px solid #c3d6f3; color: #17427e; font-weight: 700; font-size: .85rem; }
.topbar-chip a { color: inherit; }
.topbar-note { margin-left: auto; font-size: .85rem; color: var(--muted); }
.main { padding: 24px var(--container-pad) 48px; width: 100%; max-width: calc(1180px + 2 * var(--container-pad)); }
.main:focus { outline: none; }
.site-footer { margin-top: auto; border-top: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: .85rem; padding: 14px var(--container-pad); }

@media (max-width: 1023px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; padding: 12px var(--container-pad); }
  .brand { padding: 0 0 10px; }
  .nav { flex-direction: row; flex-wrap: wrap; gap: 4px; }
  .nav a { display: inline-flex; gap: 6px; padding: 6px 10px; }
  .nav a .s { display: none; }
}

/* ── 공통 부품 ─────────────────────────── */
.stage { font-size: .8rem; font-weight: 800; color: var(--primary); letter-spacing: .04em; margin-bottom: 4px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 16px; margin-bottom: 18px; }
.page-head .titles { margin-right: auto; min-width: 0; }
.page-head h1 { margin: 0; }
.page-head .lead { color: var(--muted); margin: 4px 0 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 18px; min-width: 0; }
.card > h2 { font-size: 1.05rem; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.card > h2 .step { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: var(--on-primary); font-size: .85rem; flex: none; }
.note { color: var(--muted); font-size: .9rem; }
ul.note { padding-left: 18px; margin: 6px 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 8px 16px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; text-decoration: none; color: var(--text);
}
.btn:hover { border-color: var(--primary); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-danger { color: var(--danger); border-color: var(--danger); }
.btn-sm { min-height: 36px; padding: 4px 12px; font-size: .9rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ai-send { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; }

.alert { border-radius: var(--radius); padding: 10px 14px; margin: 0 0 12px; font-size: .92rem; }
.alert.info { background: var(--primary-soft); border: 1px solid #c3d6f3; color: #17427e; }
.alert.warn { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-text); }
.alert.ok { background: var(--ok-soft); border: 1px solid #b7dcc3; color: var(--ok); }
.alert.bad { background: var(--danger-soft); border: 1px solid #f0b8b3; color: var(--danger); }
.alert ul { margin: 4px 0 0; padding-left: 18px; }

.badge { display: inline-block; font-size: .75rem; font-weight: 800; padding: 1px 8px; border-radius: 999px; background: #eef1f5; color: var(--muted); white-space: nowrap; vertical-align: middle; }
.badge.over { background: var(--danger-soft); color: var(--danger); }
.badge.soon { background: var(--warn-bg); color: var(--warn-text); }
.badge.done { background: var(--ok-soft); color: var(--ok); }
.badge.info { background: var(--primary-soft); color: #17427e; }

/* 양식 */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.form-grid .span-all { grid-column: 1 / -1; }
@media (max-width: 640px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-weight: 700; font-size: .9rem; }
.field input, .field select, .field textarea, .input {
  width: 100%; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
}
.field textarea, textarea.input { min-height: 90px; resize: vertical; line-height: 1.55; }
textarea.memo { min-height: 260px; font-size: .95rem; }
textarea.prompt { min-height: 220px; font-size: .85rem; font-family: ui-monospace, Menlo, Consolas, monospace; background: #f8fafc; }
.field .hint { font-size: .82rem; color: var(--muted); }
.field.flag input, .field.flag textarea { border-color: #d9a400; background: #fffdf3; }
.opt { display: inline-flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.opt input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--primary); flex: none; }

/* 서식 고르기 */
.tpl-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.tpl-opt { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer; min-width: 0; }
.tpl-opt input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--primary); flex: none; }
.tpl-opt .t { font-weight: 800; display: block; }
.tpl-opt .s { font-size: .82rem; color: var(--muted); display: block; }
.tpl-opt:has(input:checked) { background: var(--primary-soft); border-color: #9dbdf0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; padding: 0; list-style: none; }
.chips li, .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: #f7f9fc; font-size: .85rem; }
.chip input { width: 16px; height: 16px; accent-color: var(--primary); }
.chip.off { opacity: .55; text-decoration: line-through; }

/* 정리 방법 탭 */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); margin: 0 0 14px; }
.tabs button { border: 1px solid transparent; border-bottom: none; background: none; padding: 10px 14px; min-height: 44px; border-radius: var(--radius) var(--radius) 0 0; cursor: pointer; font-weight: 700; color: var(--muted); margin-bottom: -1px; }
.tabs button[aria-selected="true"] { background: var(--surface); border-color: var(--line); color: var(--text); }
.flow { list-style: none; margin: 0 0 12px; padding: 0; counter-reset: f; }
.flow > li { counter-increment: f; position: relative; padding: 0 0 12px 36px; }
.flow > li::before { content: counter(f); position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--primary-soft); color: #17427e; font-weight: 800; font-size: .85rem; display: flex; align-items: center; justify-content: center; }

/* 첫 화면 흐름 */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 0 0 18px; padding: 0; list-style: none; }
@media (max-width: 900px) { .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .steps { grid-template-columns: minmax(0, 1fr); } }
.steps li { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.steps .k { font-size: .78rem; font-weight: 800; color: var(--primary); }
.steps .t { font-weight: 800; display: block; margin: 2px 0 4px; }
.steps .s { font-size: .88rem; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; text-decoration: none; color: var(--text); display: block; }
.tile .k { font-size: .85rem; color: var(--muted); }
.tile .v { font-size: 1.5rem; font-weight: 800; }
.tile.over .v { color: var(--danger); }
.sample-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.sample-list .btn { justify-content: flex-start; text-align: left; height: auto; }

/* 표 */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table.list { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.list th, table.list td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.list th { background: #eef2f7; white-space: nowrap; }
table.list tr:last-child td { border-bottom: none; }
table.list tr.over td { background: #fff7f6; }
table.list tr.is-done td { color: var(--muted); }
table.list tr.is-done td.task { text-decoration: line-through; }
table.list td.nowrap { white-space: nowrap; }
table.list a { font-weight: 700; }

/* 회의록 편집 — Action Item 줄 */
.ai-rows { display: flex; flex-direction: column; gap: 8px; }
.ai-row { display: grid; grid-template-columns: 28px minmax(0, 3fr) minmax(0, 1.2fr) minmax(0, 1.3fr) auto auto; gap: 8px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: var(--radius); background: #fafbfd; }
.ai-row.flag { border-color: #d9a400; background: #fffdf3; }
.ai-row .no { font-weight: 800; color: var(--muted); text-align: center; }
.ai-row input[type="text"] { width: 100%; min-height: 40px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.ai-row .done { display: inline-flex; align-items: center; gap: 4px; font-size: .85rem; white-space: nowrap; }
.ai-row .done input { width: 18px; height: 18px; accent-color: var(--ok); }
.ai-row .warn-line { grid-column: 2 / -1; font-size: .82rem; color: var(--warn-text); }
@media (max-width: 760px) {
  .ai-row { grid-template-columns: 28px minmax(0, 1fr) minmax(0, 1fr); }
  .ai-row .task { grid-column: 2 / -1; }
  .ai-row .owner { grid-column: 2; }
  .ai-row .due { grid-column: 3; }
  .ai-row .done { grid-column: 2; }
  .ai-row .del { grid-column: 3; justify-self: end; }
}
.sticky-bar { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--line); z-index: 5; }

/* 서식 관리 — 칸 줄 */
.fld-rows { display: flex; flex-direction: column; gap: 8px; }
.fld-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr) minmax(0, 1.2fr) minmax(0, 2fr) auto; gap: 8px; align-items: center; }
.fld-row input, .fld-row select { width: 100%; min-height: 40px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.fld-row .ops { display: flex; gap: 4px; }
.fld-head { font-size: .8rem; font-weight: 700; color: var(--muted); }
@media (max-width: 760px) {
  .fld-head { display: none; }
  .fld-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding: 8px; border: 1px solid var(--line); border-radius: var(--radius); }
  .fld-row .lbl, .fld-row .hint-in { grid-column: 1 / -1; }
  .fld-row .ops { grid-column: 1 / -1; justify-content: flex-end; }
}

details.memo-src { margin-top: 8px; }
details.memo-src pre { white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; background: #f8fafc; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; font-size: .88rem; max-height: 360px; overflow: auto; }
.alias-table td:first-child { white-space: nowrap; font-weight: 700; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100vw - 32px); background: #16202c; color: #fff; padding: 10px 16px; border-radius: var(--radius); z-index: 100; font-size: .92rem; box-shadow: 0 4px 16px rgba(0, 0, 0, .2); }
.toast.err { background: var(--danger); }

/* 인쇄 — 회의록만 */
.print-area { display: none; }
@media print {
  .shell, .toast, .skip { display: none !important; }
  .print-area { display: block; }
  body { background: #fff; }
  .print-area h1 { font-size: 16pt; text-align: center; margin: 0 0 12pt; }
  .print-area table { border-collapse: collapse; width: 100%; font-size: 10.5pt; }
  .print-area th, .print-area td { border: 1px solid #777; padding: 5pt 7pt; vertical-align: top; text-align: left; }
  .print-area th { background: #eef2f7; width: 22%; white-space: nowrap; }
  .print-area table.ai th { width: auto; }
  .print-area ul { margin: 0; padding-left: 16pt; }
  .print-area .muted { color: #777; }
  .print-area .foot { margin-top: 10pt; color: #666; font-size: 9pt; }
}

.hp-tool { display: inline-flex; align-items: center; gap: 9px; min-width: 0; }
.hp-mark { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; flex: none;
  background: linear-gradient(135deg, var(--ag-brand), var(--ag-navy)); color: #fff; box-shadow: 0 4px 12px color-mix(in srgb, var(--ag-brand) 35%, transparent); }
.hp-mark-ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

@media (max-width: 639px) { .hp-wordmark small, .hp-div, .hp-tool-t { display: none; } .hp-acts .hp-ghost { display: none; } }

/* 단추 */
.hp-btn { font: inherit; font-weight: 700; font-size: 14.5px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 9px 18px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background-color .2s, border-color .2s, transform .15s, box-shadow .2s; }
.hp-btn:focus-visible { outline: 3px solid color-mix(in srgb, var(--ag-brand) 45%, transparent); outline-offset: 2px; }
.hp-lg { min-height: 50px; padding: 12px 24px; font-size: 16px; border-radius: 12px; }
.hp-primary { background: var(--ag-brand); color: #fff; box-shadow: 0 6px 18px color-mix(in srgb, var(--ag-brand) 30%, transparent); }
.hp-primary:hover { background: var(--ag-brand-d); transform: translateY(-1px); }
.hp-ghost { background: transparent; color: var(--ag-ink); border-color: var(--hp-line); }
.hp-ghost:hover { border-color: var(--ag-brand); color: var(--ag-brand-d); }
.hp-line { background: rgba(255, 255, 255, .08); color: #fff; border-color: rgba(255, 255, 255, .45); }
.hp-line:hover { background: rgba(255, 255, 255, .16); }

/* 히어로 */
.hp-hero { position: relative; overflow: hidden; color: #fff;
  background: radial-gradient(1200px 520px at 85% 15%, color-mix(in srgb, var(--ag-brand) 55%, transparent), transparent 60%),
              linear-gradient(160deg, var(--ag-navy) 0%, var(--ag-navy-2) 100%); }
.hp-hero::after { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .18;
  background-image: radial-gradient(rgba(255, 255, 255, .55) 1px, transparent 1.2px); background-size: 26px 26px;
  -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 85%); mask-image: linear-gradient(180deg, #000 0%, transparent 85%); }
.hp-cover { background: linear-gradient(100deg, color-mix(in srgb, var(--ag-navy-2) 95%, transparent) 0%, color-mix(in srgb, var(--ag-navy) 86%, transparent) 50%, color-mix(in srgb, var(--ag-navy) 55%, transparent) 100%), var(--hp-photo) center / cover no-repeat, var(--ag-navy-2); }
.hp-hero-in { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; padding-top: 56px; padding-bottom: 64px; align-items: center; }
@media (min-width: 1024px) { .hp-hero-in { grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 56px; padding-top: 84px; padding-bottom: 96px; min-height: min(78vh, 760px); } }
.hp-eyebrow { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 16px; font-size: 14px; font-weight: 700; letter-spacing: .02em; color: var(--ag-accent); }
.hp-eyebrow::before { content: ''; width: 22px; height: 2px; background: currentColor; border-radius: 2px; }
.hp-hero h1 { font-size: clamp(30px, 4.6vw, 54px); line-height: 1.18; font-weight: 800; color: #fff; }
.hp-lead { margin: 18px 0 0; font-size: clamp(16px, 1.5vw, 18.5px); line-height: 1.7; color: rgba(255, 255, 255, .84); max-width: 640px; }
.hp-cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
.hp-trust-chips { list-style: none; padding: 0; margin: 26px 0 0; display: flex; flex-wrap: wrap; gap: 8px 18px; }
.hp-trust-chips li { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; color: rgba(255, 255, 255, .78); }
.hp-hero-vis { position: relative; }
.hp-frame { margin: 0; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 30px 70px rgba(5, 12, 30, .45), 0 0 0 1px rgba(255, 255, 255, .12); }
.hp-frame-bar { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; background: #eef2f7; border-bottom: 1px solid #dfe5ee; }
.hp-frame-bar i { width: 10px; height: 10px; border-radius: 50%; background: #cfd7e2; }
.hp-frame-bar i:nth-child(1) { background: #ff6159; } .hp-frame-bar i:nth-child(2) { background: #ffbd2e; } .hp-frame-bar i:nth-child(3) { background: #28c941; }
.hp-frame-bar span { margin-left: 10px; font-size: 12px; color: #6b7a8c; background: #fff; border-radius: 6px; padding: 2px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hp-frame img { display: block; width: 100%; height: auto; max-height: 520px; object-fit: cover; object-position: top left; }
.hp-photo { margin: 0; border-radius: 18px; overflow: hidden; box-shadow: 0 30px 70px rgba(5, 12, 30, .45), 0 0 0 1px rgba(255, 255, 255, .12); aspect-ratio: 16 / 10; }
.hp-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hp-art { color: color-mix(in srgb, var(--ag-accent) 70%, #fff); opacity: .9; }
.hp-art .ag-art { position: static; width: 100%; opacity: 1; }
.hp-float { position: absolute; display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 12px; background: #fff; color: var(--ag-ink);
  font-weight: 700; font-size: 14px; box-shadow: 0 14px 34px rgba(5, 12, 30, .28); max-width: 260px; }
.hp-float .hp-ic { color: var(--ag-brand); width: 22px; height: 22px; }
.hp-float-1 { left: -18px; bottom: 28px; } .hp-float-2 { right: -14px; top: -16px; }
@media (max-width: 1023px) { .hp-float { display: none; } }

/* 배너(완성 그림) */
.hp-banner { background: var(--ag-navy-2); }
.hp-banner-btn { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; }
.hp-banner img { display: block; width: 100%; max-width: 1680px; margin: 0 auto; height: auto; max-height: 78vh; object-fit: contain; }
.hp-intro { background: linear-gradient(160deg, var(--ag-navy) 0%, var(--ag-navy-2) 100%); color: #fff; }
.hp-intro-in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px 40px; padding-top: 34px; padding-bottom: 80px; }   /* 아래 목표 카드가 40px 겹쳐 올라오므로 여백을 넉넉히 */
.hp-intro .hp-cta-row { margin-top: 0; }
.hp-h1s { font-size: clamp(22px, 2.6vw, 30px); line-height: 1.3; font-weight: 800; color: #fff; }
.hp-intro .hp-lead { margin-top: 8px; font-size: 16px; }

/* 섹션 */
.hp-sec { padding: 72px 0; }
@media (min-width: 1024px) { .hp-sec { padding: 96px 0; } }
.hp-alt { background: var(--hp-soft); }
.hp-head { max-width: 720px; margin: 0 0 40px; }
.hp-kicker { margin: 0 0 10px; font-size: 13.5px; font-weight: 800; letter-spacing: .12em; color: var(--ag-brand); }
.hp-head h2 { font-size: clamp(25px, 3vw, 36px); line-height: 1.25; font-weight: 800; color: var(--ag-ink); }
.hp-goals { padding: 0; margin-top: -40px; position: relative; z-index: 2; }
.hp-goal-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (min-width: 768px) { .hp-goal-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.hp-goal { background: #fff; border: 1px solid var(--hp-line); border-radius: 16px; padding: 22px 22px 20px; box-shadow: 0 14px 36px rgba(15, 30, 55, .08); }
.hp-goal-n { display: inline-block; font-weight: 800; font-size: 13px; color: var(--ag-brand); letter-spacing: .08em; margin-bottom: 8px; }
.hp-goal p { margin: 0; font-size: 15.5px; line-height: 1.6; color: var(--ag-ink); }
.hp-feat-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 640px) { .hp-feat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1024px) { .hp-feat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; } }
.hp-feat { border: 1px solid var(--hp-line); border-radius: 16px; padding: 26px 24px; background: #fff; transition: border-color .2s, box-shadow .2s, transform .2s; }
.hp-feat:hover { border-color: color-mix(in srgb, var(--ag-brand) 40%, var(--hp-line)); box-shadow: 0 16px 34px rgba(15, 30, 55, .08); transform: translateY(-2px); }
.hp-feat-ic { display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; margin-bottom: 16px;
  background: color-mix(in srgb, var(--ag-brand) 11%, #fff); color: var(--ag-brand); }
.hp-feat h3 { font-size: 18px; font-weight: 800; color: var(--ag-ink); margin-bottom: 8px; }
.hp-feat p { margin: 0; font-size: 15px; line-height: 1.65; color: var(--ag-sub); }
.hp-steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; counter-reset: st; }
@media (min-width: 768px) { .hp-steps { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); } }
.hp-step { position: relative; background: #fff; border: 1px solid var(--hp-line); border-radius: 16px; padding: 22px 20px; transition: border-color .35s, box-shadow .35s; }
.hp-step.is-on { border-color: var(--ag-brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ag-brand) 16%, transparent); }
.hp-step-n { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--ag-navy); color: #fff; font-weight: 800; margin-bottom: 14px; }
.hp-step.is-on .hp-step-n { background: var(--ag-brand); }
.hp-step h3 { font-size: 16.5px; font-weight: 800; color: var(--ag-ink); margin-bottom: 6px; }
.hp-step p { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--ag-sub); }
.hp-screen .hp-frame { box-shadow: 0 30px 70px rgba(15, 30, 55, .16), 0 0 0 1px var(--hp-line); }
.hp-screen .hp-frame img { max-height: none; }
.hp-cap { margin: 12px 0 0; text-align: center; font-size: 13.5px; color: var(--ag-sub); }
.hp-trust { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 768px) { .hp-trust { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.hp-tr { background: #fff; border-radius: 16px; padding: 26px 24px; border: 1px solid var(--hp-line); }
.hp-tr > .hp-ic { color: var(--ag-brand); width: 30px; height: 30px; margin-bottom: 14px; }
.hp-tr h3 { font-size: 17.5px; font-weight: 800; color: var(--ag-ink); margin-bottom: 8px; }
.hp-tr p { margin: 0; font-size: 15px; line-height: 1.65; color: var(--ag-sub); }
.hp-band { background: linear-gradient(120deg, var(--ag-navy) 0%, var(--ag-brand) 100%); color: #fff; }
.hp-band-in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px 40px; padding-top: 56px; padding-bottom: 56px; }
.hp-band h2 { font-size: clamp(22px, 2.6vw, 30px); font-weight: 800; color: #fff; }
.hp-band p { margin: 8px 0 0; color: rgba(255, 255, 255, .82); }
.hp-band .hp-cta-row { margin-top: 0; }
.hp-onband { background: #fff; color: var(--ag-navy); }
.hp-onband:hover { transform: translateY(-1px); }
.hp-line-band { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .6); }
.hp-foot { background: var(--ag-navy-2); color: rgba(255, 255, 255, .72); font-size: 14px; }
.hp-foot-in { padding-top: 34px; padding-bottom: 38px; display: grid; gap: 6px; }
.hp-foot-brand { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; color: #fff; }
.hp-foot-brand b { font-size: 16px; }
.hp-foot p { margin: 0; } .hp-foot a { color: #fff; }
.hp-foot-s { font-size: 13px; color: rgba(255, 255, 255, .55); }

/* 로그인 창 */
.hp-modal { position: fixed; inset: 0; z-index: 60; background: rgba(8, 16, 32, .55); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 18px; overflow-y: auto; }
.hp-modal[hidden] { display: none; }
.hp-dialog { position: relative; width: 100%; max-width: 440px; margin: auto; }
.hp-dialog .ag-card { margin: 0; max-width: none; box-shadow: 0 30px 80px rgba(5, 12, 30, .35); }
.hp-x { position: absolute; top: 10px; right: 12px; z-index: 2; border: 0; background: none; font-size: 26px; line-height: 1; color: var(--ag-sub); cursor: pointer; padding: 6px 8px; border-radius: 8px; }
.hp-x:hover { background: var(--hp-soft, #f1f4f8); color: var(--ag-ink); }
.hp-dialog .ag-tabs { margin-right: 34px; }

/* 밝은 테마(light) — 히어로를 크림 · 남색으로 */
.ag-light .hp-hero { background: radial-gradient(1000px 480px at 85% 10%, color-mix(in srgb, var(--ag-accent) 12%, transparent), transparent 60%), var(--ag-bg); color: var(--ag-ink); }
.ag-light .hp-hero::after { opacity: .5; background-image: radial-gradient(color-mix(in srgb, var(--ag-navy) 18%, transparent) 1px, transparent 1.2px); }
.ag-light .hp-hero h1 { color: var(--ag-navy); }
.ag-light .hp-lead, .ag-light .hp-trust-chips li { color: var(--ag-sub); }
.ag-light .hp-line { color: var(--ag-navy); border-color: color-mix(in srgb, var(--ag-navy) 35%, transparent); background: transparent; }
.ag-light .hp-primary { background: var(--ag-navy); box-shadow: 0 6px 18px color-mix(in srgb, var(--ag-navy) 25%, transparent); }
.ag-light .hp-primary:hover { background: var(--ag-navy-2); }
.ag-light .hp-frame, .ag-light .hp-photo { box-shadow: 0 30px 70px rgba(40, 30, 20, .18), 0 0 0 1px var(--hp-line); }

/* 떠오르기 — JS 가 hp-anim 을 붙였을 때만 숨긴다(효과가 꺼져도 내용은 보인다) */
.hp-anim .hp-rv { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s cubic-bezier(.2, .7, .2, 1); }
.hp-anim .hp-rv.is-in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .hp-anim .hp-rv { opacity: 1; transform: none; transition: none; } .ag-home { scroll-behavior: auto; } }

/* ═════════ 도구 화면 틀(로그인 뒤) — kit-shell ═════════
   앱 원본 CSS 는 그대로 두고 #nav · .side/.sidebar · .topbar 를 덮는다. 두 갈래:
   kit-a = .side + #nav a > .no · .t · .s(12개) / kit-b = .sidebar + .side-nav a > svg · span(03 · 07 · 08) */
.kit-ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* 왼쪽 메뉴 — 회사 남색 */
.kit-shell .side, .kit-shell .sidebar { background: linear-gradient(180deg, var(--ag-navy) 0%, var(--ag-navy-2) 100%) !important; color: #e8eef7; }
.kit-shell #nav { display: flex; flex-direction: column; gap: 2px; }
.kit-shell #nav a { color: rgba(232, 238, 247, .82) !important; border-radius: 10px; text-decoration: none; transition: background-color .15s, color .15s; }
.kit-shell #nav a:hover { background: rgba(255, 255, 255, .07) !important; color: #fff !important; }
.kit-shell #nav a[aria-current="page"] { background: color-mix(in srgb, var(--ag-brand) 70%, transparent) !important; color: #fff !important; box-shadow: inset 3px 0 0 var(--ag-accent); }
.kit-shell.kit-page-on #nav a[aria-current="page"] { background: transparent !important; box-shadow: none; color: rgba(232, 238, 247, .82) !important; }
/* kit-a: 번호 배지 · 제목 · 설명(설명은 지금 보는 메뉴에만) */
.kit-a #nav a { display: grid !important; grid-template-columns: 28px minmax(0, 1fr); column-gap: 11px; align-items: center; padding: 9px 12px !important; min-height: 44px; }
.kit-a #nav a .no { grid-row: 1 / span 2; width: 28px; height: 28px; border-radius: 8px; display: grid !important; place-items: center; font-size: 12px; font-weight: 800;
  background: rgba(255, 255, 255, .09); color: #fff !important; margin: 0 !important; }
.kit-a #nav a .t { font-size: 14.5px !important; font-weight: 700 !important; line-height: 1.3; color: inherit !important; }
.kit-a #nav a .s { display: none !important; font-size: 12px !important; line-height: 1.4; color: rgba(232, 238, 247, .68) !important; margin-top: 2px; }
.kit-a #nav a[aria-current="page"] .s { display: block !important; color: rgba(255, 255, 255, .8) !important; }
.kit-a #nav a[aria-current="page"] .no { background: var(--ag-accent); color: var(--ag-navy-2) !important; }
.kit-a.kit-page-on #nav a[aria-current="page"] .s { display: none !important; }
.kit-a.kit-page-on #nav a[aria-current="page"] .no { background: rgba(255, 255, 255, .09); color: #fff !important; }
/* kit-b: 아이콘 · 제목 */
.kit-b #nav a { display: flex !important; align-items: center; gap: 11px; padding: 10px 12px !important; min-height: 42px; font-size: 14.5px; font-weight: 600; }
.kit-b #nav a svg { width: 19px; height: 19px; opacity: .9; }

/* 「도움 · 관리」 묶음 */
.kit-nav { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, .1); }
.kit-nav-t { margin: 0 0 4px; padding: 0 12px; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; color: rgba(232, 238, 247, .5); }
.kit-nav a { display: flex; align-items: center; gap: 11px; padding: 9px 12px; min-height: 40px; border-radius: 10px; color: rgba(232, 238, 247, .82); text-decoration: none; font-size: 14px; font-weight: 600; }
.kit-nav a:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.kit-nav a[aria-current="page"] { background: color-mix(in srgb, var(--ag-brand) 70%, transparent); color: #fff; box-shadow: inset 3px 0 0 var(--ag-accent); }
.kit-nav .auth-chip-n { margin-left: auto; }

/* 위쪽 줄 — 사용 방법 · 관리 · 사용자 메뉴 */
.kit-shell .topbar { gap: 12px; }
.kit-shell .top-user { display: none !important; }   /* 앱에 박혀 있던 고정 사용자 표시 → 실제 로그인 사용자로 대신 */
.kit-shell .auth-chip { gap: 4px; margin-left: auto; }
.auth-chip-link { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 9px; color: var(--ag-sub); text-decoration: none; font-size: 14px; font-weight: 600; white-space: nowrap; }
.auth-chip-link:hover { background: #eef2f7; color: var(--ag-ink); }
.auth-chip-link[aria-current="page"] { color: var(--ag-brand-d); background: color-mix(in srgb, var(--ag-brand) 10%, #fff); }
.auth-user { position: relative; margin-left: 4px; }
.auth-user-btn { display: inline-flex; align-items: center; gap: 9px; padding: 4px 8px 4px 4px; border: 1px solid #e2e8f0; border-radius: 999px; background: #fff; cursor: pointer; font: inherit; color: var(--ag-ink); }
.auth-user-btn:hover { border-color: var(--ag-brand); }
.auth-av { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--ag-brand), var(--ag-navy)); color: #fff; font-size: 12.5px; font-weight: 800; flex: none; }
.auth-user-t { display: flex; flex-direction: column; line-height: 1.2; text-align: left; max-width: 11em; }
.auth-user-t b { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.auth-user-t small { font-size: 11.5px; color: var(--ag-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.auth-caret { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; color: var(--ag-sub); }
.auth-menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 1600; min-width: 230px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 6px; box-shadow: 0 18px 44px rgba(15, 30, 55, .16); }
.auth-menu[hidden] { display: none; }
.auth-menu-h { margin: 4px 10px 6px; font-size: 12.5px; color: var(--ag-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.auth-menu a, .auth-menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; background: none; border-radius: 8px; font: inherit; font-size: 14px; color: var(--ag-ink); text-decoration: none; cursor: pointer; text-align: left; }
.auth-menu a:hover, .auth-menu button:hover { background: #f1f5f9; }
.auth-menu .kit-ic { color: var(--ag-sub); }
@media (max-width: 899px) { .auth-chip-link span, .auth-user-t, .auth-caret { display: none; } .auth-chip-link { padding: 7px; } .auth-user-btn { padding: 2px; } }

/* 키트 페이지(사용 방법 · 내 정보 · 관리) */
.kit-page[hidden] { display: none !important; }
.kp { max-width: 1100px; color: var(--ag-ink); }
.kp-head { margin: 4px 0 22px; }
.kp-kicker { margin: 0 0 6px; font-size: 13px; font-weight: 800; letter-spacing: .1em; color: var(--ag-brand); }
.kp-head h1 { margin: 0; font-size: clamp(22px, 2.6vw, 28px); line-height: 1.3; color: var(--ag-ink); }
.kp-sub { margin: 8px 0 0; color: var(--ag-sub); font-size: 15px; max-width: 760px; }
.kp-toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; align-items: center; }
.kp-toc a { padding: 6px 12px; border-radius: 999px; background: #fff; border: 1px solid #e2e8f0; color: var(--ag-ink); text-decoration: none; font-size: 13.5px; font-weight: 600; }
.kp-toc a:hover { border-color: var(--ag-brand); color: var(--ag-brand-d); }
.kp-toc .kp-btn { margin-left: auto; }
.kp-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 22px 22px 20px; margin: 0 0 16px; scroll-margin-top: 84px; }
.kp-card h2 { margin: 0 0 14px; font-size: 18px; color: var(--ag-ink); }
.kp-flat { padding: 16px; }
.kp-grid2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 900px) { .kp-grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kp-list { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 15px; line-height: 1.65; }
.kp-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: ks; }
.kp-steps li { position: relative; padding: 12px 14px 12px 52px; border-radius: 12px; background: #f6f8fb; counter-increment: ks; display: grid; gap: 3px; }
.kp-steps li::before { content: counter(ks); position: absolute; left: 14px; top: 12px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--ag-navy); color: #fff; font-weight: 800; font-size: 13px; }
.kp-steps b { font-size: 15.5px; } .kp-steps span { font-size: 14.5px; color: var(--ag-sub); line-height: 1.6; }
.kp-flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
@media (min-width: 900px) { .kp-flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kp-flow li { display: flex; gap: 12px; padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 12px; }
.kp-flow b { font-size: 15.5px; } .kp-flow p { margin: 3px 0 0; font-size: 14.5px; color: var(--ag-sub); line-height: 1.6; }
.kp-n { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: color-mix(in srgb, var(--ag-brand) 12%, #fff); color: var(--ag-brand-d); font-weight: 800; flex: none; }
.kp-tw { overflow-x: auto; }
.kp-table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.kp-table th, .kp-table td { text-align: left; vertical-align: top; padding: 11px 10px; border-bottom: 1px solid #e8edf3; }
.kp-table thead th { background: #f4f7fb; font-size: 13px; color: var(--ag-sub); white-space: nowrap; }
.kp-table tbody th { white-space: nowrap; font-weight: 700; color: var(--ag-ink); }
.kp-table small { display: block; color: var(--ag-sub); font-size: 12.5px; }
.kp-note { margin: 10px 0 0; color: var(--ag-sub); font-size: 14px; }
.kp-foot { color: var(--ag-sub); font-size: 14.5px; } .kp-foot a { color: var(--ag-brand-d); }
.kp-btn { font: inherit; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 7px 14px; border-radius: 9px; border: 1px solid #d6dee8; background: #fff; color: var(--ag-ink); cursor: pointer; white-space: nowrap; }
.kp-btn:hover { border-color: var(--ag-brand); }
.kp-btn:disabled { opacity: .6; cursor: progress; }
.kp-primary { background: var(--ag-brand); border-color: var(--ag-brand); color: #fff; } .kp-primary:hover { background: var(--ag-brand-d); }
.kp-ghost { background: transparent; }
.kp-sm { min-height: 34px; padding: 4px 10px; font-size: 13px; }
.kp-form { gap: 12px; } .kp-form .kp-btn { justify-self: start; }
.kp-msg { margin: 6px 0 0 !important; }
.kp-hr { border: 0; border-top: 1px solid #e8edf3; margin: 18px 0; }
.kp-dl { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px 12px; margin: 0 0 16px; font-size: 14.5px; }
.kp-dl dt { color: var(--ag-sub); } .kp-dl dd { margin: 0; overflow-wrap: anywhere; }
.kp-st { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: #eef2f6; color: var(--ag-sub); white-space: nowrap; }
.kp-st.is-pending { background: var(--ag-warn-bg); color: var(--ag-warn); } .kp-st.is-active { background: var(--ag-ok-bg); color: var(--ag-ok); }
.kp-st.is-disabled { background: var(--ag-err-bg); color: var(--ag-err); } .kp-st.is-role { background: color-mix(in srgb, var(--ag-brand) 12%, #fff); color: var(--ag-brand-d); }
.kp-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 0 0 18px; }
.kp-stat { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px 16px; border-radius: 12px; border: 1px solid #e2e8f0; background: #fff; font: inherit; cursor: pointer; text-align: left; color: var(--ag-ink); }
.kp-stat span { font-size: 13px; color: var(--ag-sub); font-weight: 600; } .kp-stat b { font-size: 24px; }
.kp-stat.is-on { border-color: var(--ag-brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ag-brand) 15%, transparent); }
.kp-tabs { display: flex; gap: 2px; border-bottom: 1px solid #e2e8f0; margin: 0 0 14px; }
.kp-tabs button { font: inherit; font-size: 14.5px; font-weight: 700; padding: 10px 14px; border: 0; background: none; color: var(--ag-sub); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.kp-tabs button[aria-selected="true"] { color: var(--ag-ink); border-bottom-color: var(--ag-brand); }
.kp-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.kp-in { font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid #d6dee8; border-radius: 8px; min-width: 0; width: 100%; margin: 0 0 4px; }
.kp-search { flex: 1 1 240px; width: auto; margin: 0; min-height: 40px; }
.kp-who { display: flex; align-items: center; gap: 10px; } .kp-who b { font-size: 14.5px; }
.kp-acts { display: flex; flex-wrap: wrap; gap: 6px; min-width: 190px; }
.kp-members tr.is-pending td { background: color-mix(in srgb, var(--ag-warn-bg) 55%, #fff); }
.kp-chg { display: inline-block; margin: 0 10px 4px 0; font-size: 13.5px; }
@media print { .kit-shell .side, .kit-shell .sidebar, .kit-shell .topbar, .kp-toc, .kit-nav { display: none !important; } .kp-card { break-inside: avoid; border-color: #ccc; } }

    return /^(localhost|127\.\d+\.\d+\.\d+|\[::1\]|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+)$/i.test(host) || /\.(local|internal|lan|corp)$/i.test(host);
  }

  /* 설정 점검 — errors 가 있으면 보내지 않습니다. pageProtocol 은 location.protocol('https:' · 'file:' …) */
  function validateConfig(cfg, pageProtocol) {
    var errors = [], warnings = [];

    var m = /^(https?):\/\/([^/:?#]+|\[[^\]]+\])(:\d+)?(\/[^?#]*)?$/i.exec(base);

    else if (!m) errors.push('주소는 http:// 또는 https:// 로 시작해야 합니다(예: https://llm.example.com/v1).');
    if (!str(cfg && cfg.model)) errors.push('모델 이름을 적어 주세요(서버에 올라가 있는 모델 이름 그대로).');
    if (m) {
      var scheme = m[1].toLowerCase(), host = m[2];
      if (scheme === 'http' && pageProtocol === 'https:' && isLoopback(host))
        warnings.push('온라인 페이지(https)에서 내 PC 의 http 서버로 보냅니다. 크롬 · 엣지는 허용하지만, 서버가 이 주소의 요청을 허용(CORS)해야 합니다 — Ollama 는 OLLAMA_ORIGINS, LM Studio 는 「Enable CORS」. 안 되면 「설정 → HTML 한 파일로 받기」로 받은 파일을 더블클릭해 여세요(file://).');
      else if (scheme === 'http' && pageProtocol === 'https:')
        errors.push('이 페이지는 https 라서 http 주소로는 보낼 수 없습니다(브라우저가 막음). 이 도구를 내 PC 에서 파일로 열거나(file://), 서버를 https 로 열어 주세요.');
      if (pageProtocol === 'file:' && !isLoopback(host))
        warnings.push('이 도구를 파일(file://, HTML 한 파일)로 열었습니다. 브라우저는 파일에서 보내는 요청에 「Origin: null」을 붙이므로, 사내 AI 서버가 그 요청을 허용(CORS)해야 보낼 수 있습니다. 「연결 확인」이 실패하면 IT 에 허용을 요청하거나 반자동(프롬프트 복사 · 붙여 넣기)을 쓰세요.');

        warnings.push('키가 암호화되지 않은 http 로 전송됩니다. 사내망 안이라도 https 를 권합니다.');
      if (/api\.openai\.com$/i.test(host)) warnings.push('외부 서비스입니다. 회의 메모(사내 문서)를 보내도 되는지 회사 보안정책을 먼저 확인해 주세요. 이름 가리기를 켜 두세요.');
      if (!/\/v\d+$/i.test(m[4] || '')) warnings.push('주소가 보통 「…/v1」로 끝납니다. 서버 안내의 주소를 확인해 주세요.');
    }
    return { errors: errors, warnings: warnings };
  }

  /* 요청 만들기 — fetch(url, init) 에 그대로 넘깁니다. 키가 비면 Authorization 머리글을 넣지 않습니다 */
  function buildChatRequest(cfg, messages, opts) {
    opts = opts || {};
    var headers = { 'Content-Type': 'application/json' };
    var key = str(cfg && cfg.apiKey);
    if (key) headers.Authorization = 'Bearer ' + key;
    var body = { model: str(cfg && cfg.model), messages: messages, temperature: cfg && cfg.temperature != null ? Number(cfg.temperature) : 0.2 };

  }
  /* 프롬프트 한 덩어리 → messages */
  function promptMessages(prompt, system) {
    var out = [];
    if (system) out.push({ role: 'system', content: system });
    out.push({ role: 'user', content: String(prompt) });
    return out;
  }
  /* Qwen3 등 생각하는 모델의 <think>…</think> 떼기
     - <think>…</think> 가 여러 번 있어도 모두 뗍니다.
     - 서버 템플릿이 여는 <think> 를 프롬프트 쪽에 넣어 답에는 </think> 만 오는 경우 → 마지막 </think> 앞을 모두 뗍니다.
     - <think> 로 시작했는데 닫히지 않음(답 길이 제한에 걸려 생각만 오고 끝남) → truncated: true */
  function stripThinking(text) {

  }
  /* 응답 읽기 — choices[0].message.content. 서버 오류는 알아볼 수 있는 문장으로 */
  function parseChatResponse(json) {
    if (!json || typeof json !== 'object') throw new Error('AI 서버 응답이 JSON 이 아닙니다.');
    if (json.error) throw new Error('AI 서버 오류: ' + (json.error.message || JSON.stringify(json.error)));

    var text = c && (c.message ? c.message.content : c.text);
    if (Array.isArray(text)) text = text.map(function (p) { return p && (p.text || ''); }).join('');
    if (typeof text !== 'string' || !text.trim()) throw new Error('AI 서버 응답에 답 글(choices[0].message.content)이 없습니다.');
    var s = stripThinking(text);
    if (!s.text) throw new Error(s.truncated ? 'AI 가 생각하는 과정(<think>)만 보내고 답이 잘렸습니다. 서버의 답 길이 제한을 늘리거나 생각하는 모드를 꺼 주세요(Ollama 는 프롬프트 맨 앞에 /no_think).'
      : 'AI 서버 응답에 생각하는 과정(<think>)만 있고 답 글이 없습니다.');
    return s.text;
  }
  /* 모델 목록 — GET …/v1/models (OpenAI 호환 서버 공통: vLLM · Ollama · LM Studio 등). 서버에 올라간 정확한 모델 이름 확인용 */
  function buildModelsRequest(cfg) {
    var headers = {}, key = str(cfg && cfg.apiKey);
    if (key) headers.Authorization = 'Bearer ' + key;
    return { url: normalizeBaseUrl(cfg && cfg.baseUrl) + '/models', init: { method: 'GET', headers: headers } };
  }
  function parseModelsResponse(json) {
    if (!json || typeof json !== 'object') throw new Error('모델 목록 응답이 JSON 이 아닙니다.');
    if (json.error) throw new Error('AI 서버 오류: ' + (json.error.message || JSON.stringify(json.error)));
    var list = Array.isArray(json.data) ? json.data : Array.isArray(json.models) ? json.models : [];
    return list.map(function (m) { return str(m && (m.id || m.name || m.model)); }).filter(Boolean);
  }
  /* 적은 모델 이름과 서버 목록 비교 — 같으면 exact, 대소문자 · 기호(. : - _)만 다르면 그 이름을 suggest */
  function matchModel(model, list) {
    var want = str(model), key = function (x) { return str(x).toLowerCase().replace(/[.:_\-\s]/g, ''); };
    if ((list || []).indexOf(want) >= 0) return { exact: true, suggest: want };
    var near = (list || []).filter(function (x) { return key(x) === key(want); });
    return { exact: false, suggest: near[0] || '' };
  }
  function callModels(cfg, opts) {
    opts = opts || {};
    var f = opts.fetch || (typeof fetch === 'function' ? fetch : null);
    if (!f) return Promise.reject(new Error('이 환경에서는 fetch 를 쓸 수 없습니다.'));
    var req = buildModelsRequest(cfg);
    return f(req.url, req.init).then(function (res) {
      return res.text().then(function (t) {
        var j = null; try { j = JSON.parse(t); } catch (e) { /* 아래에서 */ }
        if (!res.ok) throw new Error('모델 목록 요청에 서버가 ' + res.status + ' 로 답했습니다. ' + (j && j.error ? (j.error.message || '') : t.slice(0, 200)));
        return parseModelsResponse(j);
      });
    }, function (e) { throw new Error('AI 서버에 연결하지 못했습니다. 주소·사내망 연결·서버의 CORS 허용 설정을 확인해 주세요. (' + (e && e.message || e) + ')'); });
  }
  /* 실제 호출 — fetchImpl 은 테스트용 */
  function callChat(cfg, messages, opts) {
    opts = opts || {};
    var f = opts.fetch || (typeof fetch === 'function' ? fetch : null);
    if (!f) return Promise.reject(new Error('이 환경에서는 fetch 를 쓸 수 없습니다.'));
    var req = buildChatRequest(cfg, messages, opts);
    var timer = null, ctl = typeof AbortController === 'function' ? new AbortController() : null;
    if (ctl) { req.init.signal = ctl.signal; timer = setTimeout(function () { ctl.abort(); }, (Number(cfg.timeoutSec) || 120) * 1000); }
    return f(req.url, req.init).then(function (res) {
      return res.text().then(function (t) {
        var j = null; try { j = JSON.parse(t); } catch (e) { /* 아래에서 */ }
        if (!res.ok) throw new Error('AI 서버가 ' + res.status + ' 로 답했습니다. ' + (j && j.error ? (j.error.message || '') : t.slice(0, 200)));
        return parseChatResponse(j);
      });
    }, function (e) {
      throw new Error(e && e.name === 'AbortError' ? 'AI 서버가 제한 시간 안에 답하지 않았습니다.'
        : 'AI 서버에 연결하지 못했습니다. 주소·사내망 연결·서버의 CORS 허용 설정을 확인해 주세요. (' + (e && e.message || e) + ')');
    }).then(function (x) { if (timer) clearTimeout(timer); return x; }, function (e) { if (timer) clearTimeout(timer); throw e; });
  }

  /* 저장 — 키는 remember 일 때만 남깁니다 */
  function toStored(cfg) {
    var c = cleanConfig(cfg);
    if (!c.remember) c.apiKey = '';
    return c;
  }
  function cleanConfig(p) {
    var c = defaultConfig();
    if (!p || typeof p !== 'object') return c;
    c.baseUrl = normalizeBaseUrl(p.baseUrl);
    c.model = p.model == null ? DEFAULT_MODEL : str(p.model);   // 예전에 저장한 설정에 모델 칸이 없으면 기본값
    c.apiKey = str(p.apiKey);
    c.remember = !!p.remember;
    var t = Number(p.temperature); if (isFinite(t) && t >= 0 && t <= 2) c.temperature = t;
    var s = Number(p.timeoutSec); if (isFinite(s) && s >= 10 && s <= 600) c.timeoutSec = Math.round(s);
    return c;
  }
  function isReady(cfg) { return !!(cfg && normalizeBaseUrl(cfg.baseUrl) && str(cfg.model)); }
  function describe(cfg) {
    if (!isReady(cfg)) return '자동 보내기 설정 없음(반자동만)';
    var host = (/^https?:\/\/([^/]+)/i.exec(normalizeBaseUrl(cfg.baseUrl)) || [])[1] || '';
    return host + ' · ' + str(cfg.model) + (str(cfg.apiKey) ? ' · 키 있음' : ' · 키 없음');
  }

  /* 브라우저 저장 */
  var session = null; // 기억하지 않는 키는 이 창에서만
  function load() {
    var c = defaultConfig();
    try { c = cleanConfig(JSON.parse(localStorage.getItem(STORE_KEY) || 'null')); } catch (e) { /* 막힌 저장소 */ }
    if (session && !c.apiKey) c.apiKey = session.apiKey;
    return c;
  }
  function save(cfg) {
    var c = cleanConfig(cfg);
    session = { apiKey: c.apiKey };
    try { localStorage.setItem(STORE_KEY, JSON.stringify(toStored(c))); return true; } catch (e) { return false; }
  }

  return {
    STORE_KEY: STORE_KEY, DEFAULT_MODEL: DEFAULT_MODEL, PRESETS: PRESETS, stripThinking: stripThinking,
    buildModelsRequest: buildModelsRequest, parseModelsResponse: parseModelsResponse, matchModel: matchModel, callModels: callModels, defaultConfig: defaultConfig, normalizeBaseUrl: normalizeBaseUrl, endpointUrl: endpointUrl,
    validateConfig: validateConfig, buildChatRequest: buildChatRequest, promptMessages: promptMessages, parseChatResponse: parseChatResponse,
    callChat: callChat, cleanConfig: cleanConfig, toStored: toStored, isReady: isReady, describe: describe, load: load, save: save
  };
});

  <script>/* js/ai-panel.js */

(function () {

    }
    return h('section', { class: 'card', id: 'aiSettings' }, h('h2', null, 'AI 연결 설정 (선택 — 로컬 LLM · 자동 보내기)'),
      h('p', { class: 'note' }, '설정하지 않으면 반자동입니다(프롬프트 복사 → 회사가 허용한 AI 에 붙여 넣기 → 답 붙여 넣기). ' +

  function readMemoFile(f) {
    var name = f.name.toLowerCase();
    if (/\.(doc|hwp|hwpx|pdf)$/.test(name)) return Promise.reject(new Error(f.name + ': 이 형식은 1단계에서 읽지 못합니다. 워드에서 「다른 이름으로 저장 → .docx」 로 저장하거나 글을 복사해 붙여 넣어 주세요.'));
    return new Promise(function (ok, bad) {
      var fr = new FileReader();
      fr.onload = function () { ok(new Uint8Array(fr.result)); };
      fr.onerror = function () { bad(new Error(f.name + ': 파일을 읽지 못했습니다.')); };
      fr.readAsArrayBuffer(f);
    }).then(function (bytes) {
      if (/\.docx$/.test(name)) {
        if (!window.JSZip) throw new Error('워드 읽기 도구(vendor/jszip.min.js)를 불러오지 못했습니다. 폴더째 받았는지 확인해 주세요.');
        return window.JSZip.loadAsync(bytes).then(function (zip) {
          var doc = zip.file('word/document.xml');
          if (!doc) throw new Error(f.name + ': 워드 본문(word/document.xml)이 없습니다.');
          return doc.async('string');
        }).then(function (xml) {
          var t = L.docxXmlToText(xml);
          if (!t.trim()) throw new Error(f.name + ': 글이 없습니다(그림만 있는 문서일 수 있음).');
          return t;
        });
      }
      return L.decodeText(bytes);
    });
  }

            h('div', { class: 'btn-row', style: 'margin:8px 0' }, h('button', { type: 'button', class: 'btn btn-primary', onclick: function () { copyText(pIn.value, '프롬프트를 복사했습니다. 회사가 허용한 AI 에 붙여 넣으세요.'); } }, '프롬프트 복사')),

          h('div', { class: 'btn-row', style: 'margin-top:8px' }, h('button', { type: 'button', class: 'btn', onclick: function () { fillFromAnswer(answerIn.value); } }, '이 답으로 서식 채우기')))

  function viewEdit(id) {

    var tpl = work.template, dirty = false;
    var METHOD = { 'rule': 'AI 없이 규칙 초안', 'ai-semi': '반자동 AI 답', 'ai-auto': '설정한 AI 서버 답' };
    main.appendChild(pageHead('02 · 회의록 편집', L.minuteTitle(work),
      tpl.name + ' 서식 · ' + (METHOD[work.method] || '직접 작성') + ' · 만든 날 ' + work.createdAt.slice(0, 10) + '. 고친 뒤 「저장」을 눌러 주세요.',

    function renderChecks() {
      checkBox.innerHTML = '';

      if (!fl.length) { add(checkBox, h('p', { class: 'alert ok' }, '메모 근거 점검: 담당 · 기한 · 결정 문장이 모두 메모에서 확인됩니다.')); return; }
      add(checkBox, h('div', { class: 'alert warn' }, h('b', null, '확인 필요 ' + fl.length + '건'), ' — 메모에 없거나 비어 있는 값입니다. AI 가 지어낸 것인지 확인해 주세요.',
        h('ul', null, fl.map(function (x) { return h('li', null, x.label + (x.index != null ? ' ' + (x.index + 1) + '번' : '') + ': ' + x.message); }))));
    }
    function renderForm() {
      form.innerHTML = '';
      var fl = flags();
      var grid = h('div', { class: 'form-grid' });
      tpl.fields.forEach(function (f) {

        var flagged = fl.some(function (x) { return x.key === f.key && f.type !== 'actions'; });
        if (f.type === 'actions') { grid.appendChild(h('div', { class: 'span-all' }, actionEditor(f))); return; }
        var ctl;

          ctl = h('input', { value: v || '' });

          ctl = h('textarea', { rows: Math.max(3, (f.type === 'list' ? v.length : String(v).split('\n').length) + 1) });
          ctl.value = f.type === 'list' ? (v || []).join('\n') : (v || '');
          ctl.addEventListener('input', function () {
            work.values[f.key] = f.type === 'list' ? ctl.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean) : ctl.value;
            markDirty();
          });
          ctl.addEventListener('change', renderChecks);
          grid.appendChild(fld(f.label, ctl, f.type === 'list' ? '한 줄에 한 항목' + (f.hint ? ' · ' + f.hint : '') : f.hint, 'span-all' + (flagged ? ' flag' : '')));
        }

    function actionEditor(f) {

      var fl = flags().filter(function (x) { return x.key === f.key; });

      });

      add(wrap, [rows, h('div', { class: 'btn-row', style: 'margin-top:8px' }, h('button', { type: 'button', class: 'btn btn-sm', onclick: function () { list.push({ task: '', owner: '', due: '', done: false }); markDirty(); renderForm(); } }, '할 일 더하기'))]);

    if (work.memo) main.appendChild(h('section', { class: 'card' }, h('details', { class: 'memo-src' }, h('summary', null, '메모 원문 보기(대조용)'), h('pre', null, work.memo))));

      if (!quiet) { toast('저장했습니다.'); render(); }
    }
    function fileBase() { return L.safeFileName((L.minuteDate(work) || '') + '_' + L.minuteTitle(work)); }

      h('label', { class: 'opt' }, md, h('span', null, '새 메모는 이름 가리기를 켠 채로 시작')),
      h('label', { class: 'opt', style: 'margin-top:6px' }, km, h('span', null, '회의록에 메모 원문도 저장(메모 근거 점검 · 대조에 씀). 끄면 정리한 결과만 남습니다.')),
      fld('늘 가릴 이름', always, '메모에 이 이름이 있으면 자동으로 가릴 목록에 넣습니다. 참석자 줄에 없는 사람(고객 담당자 등)을 적어 두세요.', ''),
      h('div', { class: 'btn-row', style: 'margin-top:10px' }, h('button', { type: 'button', class: 'btn btn-primary', onclick: function () {
        db.maskNames = always.value.split(/[,，\n]+/).map(function (x) { return x.trim(); }).filter(Boolean);
        db.maskDefault = md.checked; db.keepMemo = km.checked; save(); toast('저장했습니다.');
      } }, '저장'))));

    var imp = h('input', { type: 'file', accept: '.json,application/json', 'aria-label': '백업 파일 고르기' });
    imp.addEventListener('change', function () {
      var f = imp.files && imp.files[0]; if (!f) return;
      f.text().then(function (t) {
        var j = JSON.parse(t);
        if (!j || j.app !== 'data10-10') throw new Error('이 도구의 백업 파일이 아닙니다.');
        if (!confirm('지금 저장된 서식 · 회의록을 백업 파일 내용으로 바꿀까요?')) return;
        db = L.cleanDb(j.db); save(); render(); toast('백업을 불러왔습니다(회의록 ' + db.minutes.length + '건).');
      }).catch(function (e) { toast('불러오지 못했습니다: ' + e.message, true); });
    });
    main.appendChild(h('section', { class: 'card' }, h('h2', null, '백업 · 옮기기'),
      h('p', { class: 'note' }, '회의록은 이 브라우저에만 있습니다. 브라우저 기록을 지우면 사라지니 가끔 백업 파일을 받아 두세요. 다른 PC 로 옮길 때도 씁니다. AI 키는 백업에 들어가지 않습니다.'),
      h('div', { class: 'btn-row' },
        h('button', { type: 'button', class: 'btn', onclick: function () { download('회의록요약_백업_' + todayIso() + '.json', new Blob([JSON.stringify({ app: 'data10-10', schema: L.SCHEMA, savedAt: new Date().toISOString(), db: db }, null, 1)], { type: 'application/json' })); } }, '백업 파일 받기(.json)'),
        h('label', { class: 'btn' }, '백업 불러오기', h('span', { hidden: true }, imp)),
        h('button', { type: 'button', class: 'btn btn-danger', onclick: function () {
          if (!confirm('서식 · 회의록 · 작성 중 메모를 모두 지울까요? 되돌릴 수 없습니다.')) return;
          db = L.cleanDb(null); draft = emptyDraft(); save(); saveDraft(); render(); toast('모두 지웠습니다.');
        } }, '모두 지우기'))));
  }

  /* HTML 한 파일 — 회사 보안으로 웹 주소가 막힐 수 있어(2026-11-10 요청) 사내 PC 에 저장해 두고 더블클릭해 씁니다(설치 · exe 없음) */
  function singleFileCard() {
    var steps = h('ol', { class: 'flow' },
      h('li', null, '아래 단추로 ', h('code', null, SINGLE_NAME), ' 한 파일을 받아 PC 의 알맞은 폴더(예: 문서\\회의록)에 둡니다. 인터넷이 되는 PC 에서 받아 사내 메일 · USB 로 옮겨도 됩니다.'),
      h('li', null, '파일을 더블클릭하면 브라우저(Edge · Chrome)로 열립니다. 설치 · 실행 파일(exe)이 없고, 로그인 없이 바로 씁니다. 외부 주소를 부르지 않습니다.'),
      h('li', null, '회의록 · 서식은 그 PC 의 그 브라우저 안에만 저장됩니다. 다른 브라우저로 열면 빈 화면에서 시작하니, PC 를 바꿀 때는 아래 「백업 · 옮기기」의 JSON 으로 옮깁니다.'),
      h('li', null, '새 판으로 바꿀 때는 새 파일을 같은 이름 · 같은 폴더에 덮어쓰고 다시 엽니다. 같은 브라우저로 열면 쌓아 둔 회의록이 그대로 이어집니다. 바꾸기 전에 JSON 백업을 한 번 받아 두세요.'),
      h('li', null, 'AI 자동 보내기: 내 PC 의 로컬 LLM(Ollama · LM Studio)은 그대로 쓸 수 있습니다. 사내 AI 서버는 파일에서 오는 요청(Origin: null)을 허용(CORS)해야 하므로, 막히면 반자동(프롬프트 복사 · 붙여 넣기)을 쓰세요.'));
    return h('section', { class: 'card', id: 'singleCard' }, h('h2', null, 'HTML 한 파일로 쓰기 (내 PC · 설치 없음)'),
      SINGLE ? h('p', { class: 'alert info' }, '지금 열린 것이 HTML 한 파일 판입니다(판 ' + APP_VERSION + '). 새 판은 인터넷이 되는 PC 에서 이 도구 사이트(처음 이 파일을 받은 주소)를 열어 「설정 → HTML 한 파일로 받기」로 받습니다.')
        : h('div', { class: 'btn-row' }, h('a', { class: 'btn btn-primary', id: 'singleDownload', href: 'dist/' + SINGLE_NAME, download: SINGLE_NAME }, 'HTML 한 파일로 받기 (판 ' + APP_VERSION + ')')),
      steps,
      h('p', { class: 'note' }, '실행 파일(exe)이 꼭 필요하면 리포의 tools/local-exe 에 PyInstaller 「폴더형 · 아카이브 없음(--onedir --noarchive)」으로 만드는 순서가 있습니다. 회사 보안 프로그램에 따라 이것도 막힐 수 있어 HTML 한 파일을 먼저 권합니다.'));
  }

  /* ── 길잡이 ───────────────────────────────── */
  function render() {
    leaveGuard = null;
    var hash = location.hash.replace(/^#\/?/, '') || 'home';
    var parts = hash.split('?'), path = parts[0].split('/'), id = path[0];
    main.innerHTML = '';
    nav(id === 'edit' ? 'list' : id);
    topbar();
    if (id === 'write') viewWrite();
    else if (id === 'edit') viewEdit(path[1]);
    else if (id === 'list') viewList();
    else if (id === 'actions') viewActions(parts[1]);
    else if (id === 'templates') viewTemplates();
    else if (id === 'settings') viewSettings();
    else viewHome();
  }
  var lastHash = location.hash;
  window.addEventListener('hashchange', function () {
    if (leaveGuard && leaveGuard() && !confirm('저장하지 않은 고친 내용이 있습니다. 이동할까요?')) { history.replaceState(null, '', lastHash); return; }
    lastHash = location.hash;
    render(); main.focus({ preventScroll: true }); window.scrollTo(0, 0);
  });
  render();
})();

  function openModal() {

  }
  function closeModal() { var m = gate.querySelector('#agModal'); if (m) m.hidden = true; gate.classList.remove('hp-modal-open'); }
  function bindHome() {
    gate.querySelectorAll('[data-login]').forEach(function (b) {
      b.onclick = function () { viewLogin(b.getAttribute('data-login'), null, true); };
    });
    var m = gate.querySelector('#agModal');
    m.addEventListener('click', function (e) { if (e.target === m || e.target.hasAttribute('data-close')) closeModal(); });
    gate.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !m.hidden) closeModal(); });
    gate.querySelectorAll('.hp-nav a[href^="#"]').forEach(function (a) {
      a.onclick = function (e) { var t = gate.querySelector(a.getAttribute('href')); if (!t) return; e.preventDefault(); t.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); };
    });
    var nav = gate.querySelector('.hp-nav');
    gate.addEventListener('scroll', function () { nav.classList.toggle('is-scrolled', gate.scrollTop > 8); }, { passive: true });
    // 화면에 들어올 때 살짝 떠오른다 — 모션 최소화 · IntersectionObserver 없으면 처음부터 보인다
    var els = gate.querySelectorAll('.hp-rv');
    if (reduce || !('IntersectionObserver' in window)) { els.forEach(function (el) { el.classList.add('is-in'); }); }
    else {
      gate.classList.add('hp-anim');
      var io = new IntersectionObserver(function (es) { es.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); } }); }, { root: gate, threshold: 0.12 });
      els.forEach(function (el) { io.observe(el); });
    }
    // 사용 순서 — 차례로 밝아진다
    var steps = gate.querySelectorAll('.hp-step'), k = 0;
    if (steps.length && !reduce) fxTimer = setInterval(function () {
      if (gate.hidden) return stopFx();
      steps.forEach(function (s, j) { s.classList.toggle('is-on', j === k); }); k = (k + 1) % steps.length;
    }, 2200);
  }

  // ───────── 로그인 · 회원가입 ─────────
  function viewLogin(tab, note, open) {
    var signup = tab === 'signup';
    var card = ('<div class="ag-card">' +
      '<div class="ag-tabs" role="tablist"><button type="button" role="tab" data-tab="login" aria-selected="' + !signup + '">로그인</button>' +
      '<button type="button" role="tab" data-tab="signup" aria-selected="' + signup + '">회원가입</button></div>' +
      (signup ?
        '<form class="ag-form" id="agSignup" novalidate>' +
        '<label>이름<input name="name" autocomplete="name" required maxlength="80"></label>' +
        '<label>소속(회사 · 부서)<input name="org" autocomplete="organization" maxlength="120" placeholder="예) 품질팀"></label>' +
        '<label>연락처<input name="phone" type="tel" autocomplete="tel" maxlength="40" placeholder="010-0000-0000"></label>' +
        '<label>이메일 <small>회사 메일 또는 개인 메일</small><input name="email" type="email" autocomplete="email" required maxlength="200"></label>' +
        '<label>비밀번호 <small>8자 이상</small><input name="pw" type="password" autocomplete="new-password" required minlength="8"></label>' +
        '<label>비밀번호 확인<input name="pw2" type="password" autocomplete="new-password" required minlength="8"></label>' +
        '<button class="ag-btn ag-primary" type="submit">가입하고 사용 신청</button></form>'
        :
        '<form class="ag-form" id="agLogin" novalidate>' +
        '<label>이메일<input name="email" type="email" autocomplete="email" required></label>' +
        '<label>비밀번호<input name="pw" type="password" autocomplete="current-password" required></label>' +
        '<button class="ag-btn ag-primary" type="submit">로그인</button></form>' +
        (C.kakao ? '<div class="ag-or"><span>또는</span></div><button type="button" class="ag-btn ag-kakao" id="agKakao">카카오로 로그인</button>' : '') +
        '<p class="ag-hint">처음이면 「회원가입」에서 가입하세요. 비밀번호를 잊었으면 관리자에게 알려 주세요.</p>') +
      '<p class="ag-msg" role="status" aria-live="polite"></p></div>');
    if (homeOn()) {
      if (!gate.querySelector('.hp')) {
        stopFx(); root.classList.add('auth-lock'); gate.hidden = false;
        gate.classList.add('ag-home'); gate.innerHTML = homeHtml(); gate.scrollTop = 0; bindHome();
      }
      gate.querySelector('#agModalBody').innerHTML = card;
      if (open || note) openModal();
    } else show(card);
    if (note) msg(note.text, note.kind);
    gate.querySelectorAll('[data-tab]').forEach(function (b) { b.onclick = function () { viewLogin(b.getAttribute('data-tab'), null, true); }; });
    var f = $('#agLogin');
    if (f) f.onsubmit = function (ev) {
      ev.preventDefault();
      var b = f.querySelector('button'), em = f.email.value.trim(), pw = f.pw.value;
      if (!em || !pw) return msg('이메일과 비밀번호를 넣어 주세요.', 'err');
      busy(b, true); msg('로그인 중…');
      sb.auth.signInWithPassword({ email: em, password: pw }).then(function (r) {
        busy(b, false); if (r.error) return msg(errText(r.error), 'err'); route();
      });
    };
    var k = $('#agKakao');
    if (k) k.onclick = function () {
      busy(k, true);
      sb.auth.signInWithOAuth({ provider: 'kakao', options: { redirectTo: location.origin + location.pathname } }).then(function (r) {
        if (r.error) { busy(k, false); msg(errText(r.error), 'err'); }
      });
    };
    var g = $('#agSignup');
    if (g) g.onsubmit = function (ev) {
      ev.preventDefault();
      var b = g.querySelector('button'), d = { name: g.name.value.trim(), org: g.org.value.trim(), phone: g.phone.value.trim() };
      var em = g.email.value.trim(), pw = g.pw.value;
      if (!d.name) return msg('이름을 넣어 주세요.', 'err');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return msg('이메일 모양이 맞지 않습니다.', 'err');
      if (pw.length < 8) return msg('비밀번호는 8자 이상으로 해 주세요.', 'err');
      if (pw !== g.pw2.value) return msg('비밀번호 확인이 다릅니다.', 'err');
      busy(b, true); msg('가입 중…');
      sb.auth.signUp({ email: em, password: pw, options: { data: d, emailRedirectTo: location.origin + location.pathname } }).then(function (r) {
        busy(b, false);
        if (r.error) return msg(errText(r.error), 'err');
        if (r.data && r.data.user && r.data.user.identities && r.data.user.identities.length === 0) return msg('이미 가입한 이메일입니다. 로그인해 주세요.', 'err');
        if (!r.data.session) return viewLogin('login', { text: '확인 메일을 보냈습니다. 메일의 링크를 누른 뒤 로그인하면 사용 신청이 들어갑니다.', kind: 'ok' });
        route();
      });
    };
  }

  // ───────── 판정 ─────────
  // 판정은 겹쳐 불려도 된다 — 늦게 끝난 옛 판정이 새 화면을 덮지 않게 차례 번호로 거른다
  var gen = 0, routing = false;
  function route() {
    var my = ++gen; routing = true;
    function live() { return my === gen; }
    return sb.auth.getSession().then(function (r) {
      if (!live()) return;
      cleanUrl();
      var s = r.data && r.data.session;
      if (!s) { me = member = null; stopIdle(); removeChip(); viewLogin('login'); return; }
      me = s.user;
      return sb.from(T.members).select('user_id,name,org,phone,email,roles,status').eq('user_id', me.id).maybeSingle().then(function (q) {
        if (!live()) return;
        if (q.error) return viewError(q.error);
        member = q.data;
